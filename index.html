<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <title>mindcash</title>
  </head>
  <body>
      <div vw class="enabled" id="vlibras-widget">
          <div vw-access-button class="active"></div>
          <div vw-plugin-wrapper>
              <div class="vw-plugin-top-wrapper"></div>
          </div>
      </div>
      <div id="root"></div>
      <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
      <script>
          new VLibras.Widget('https://vlibras.gov.br/app');
      </script>
        <script>
        if (localStorage.getItem('vlibras') !== 'true') {
            document.addEventListener('DOMContentLoaded', () => {
            const widget = document.getElementById('vlibras-widget')
            if (widget) widget.style.display = 'none'
            const wrapper = document.getElementById('vlibras-access-wrapper')
            if (wrapper) wrapper.style.display = 'none'
            })
        }
        </script>
    <script type="module" src="/src/main.tsx"></script>
      <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
